aid: marginfi
name: marginfi
description: >-
  marginfi is a decentralized borrowing and lending protocol built on the Solana
  blockchain by mrgn labs. Users lend supported Solana tokens to earn yield and
  borrow against supplied collateral, with account-health, e-mode, liquid
  staking token (LST), and leveraged looping (mrgnloop) products layered on top
  of the core mrgnlend market. marginfi exposes no hosted REST API — developers
  integrate on-chain through the marginfi-v2 Solana program using the official
  TypeScript SDK (marginfi-client-v2, mrgn-common) and the Rust (CLI) SDK, with
  an early-alpha Python SDK (marginpy) and a Rust CPI interface crate also
  published. It was surfaced through the API Evangelist network as a portfolio
  company of Multicoin Capital and Pantera Capital.
